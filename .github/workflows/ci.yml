name: Fedora 44 CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: fedora:44
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install build dependencies
        run: |
          dnf install -y \
            cargo \
            checkpolicy \
            clang-tools-extra \
            clippy \
            cmake \
            extra-cmake-modules \
            gcc-c++ \
            gettext \
            kf6-kcmutils-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel \
            kf6-kirigami-devel \
            kf6-kwallet-devel \
            libasan \
            libubsan \
            ninja-build \
            opencv-devel \
            openssl-devel \
            pam-devel \
            python3 \
            rust \
            rustfmt \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtmultimedia-devel \
            systemd-devel

      - name: Check C++ formatting
        run: |
          find src tests/unit engine/vision-opencv-sys/native engine/crypto-openssl-sys/native \
            -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure and build
        run: |
          cmake --fresh -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKFACEAUTH_ENABLE_NATIVE_SANITIZERS=ON
          cmake --build build --parallel 2

      - name: Check native engine skeleton
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --all -- --check
          cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets --locked --offline -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --workspace --all-targets --locked --offline
          python3 tools/verify_models.py --root models
          msgfmt --check --check-format --output-file=/dev/null po/sv/kcm_kfaceauth.po

      - name: Run unit and fixture tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Lint QML
        run: |
          /usr/lib64/qt6/bin/qmllint \
            src/kcm/ui/*.qml \
            src/kcm/ui/components/*.qml
