name: Fedora 44 RPM

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: fedora:44
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            cargo \
            checkpolicy \
            clang-tools-extra \
            clippy \
            cmake \
            cmake-rpm-macros \
            desktop-file-utils \
            extra-cmake-modules \
            gcc-c++ \
            gh \
            kf6-kcmutils-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel \
            kf6-kirigami-devel \
            kf6-kwallet-devel \
            ninja-build \
            opencv-devel \
            openssl-devel \
            pam-devel \
            python3 \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtmultimedia-devel \
            rpm-build \
            rpmlint \
            rust \
            rustfmt \
            systemd-devel \
            systemd-rpm-macros

      - name: Build source archive
        run: packaging/fedora/create-source-archive.sh

      - name: Build and lint RPM
        run: |
          rpmbuild -ba packaging/fedora/kfaceauth.spec \
            --define "_sourcedir $PWD"
          rpmlint -c packaging/fedora/kfaceauth.toml \
            packaging/fedora/kfaceauth.spec \
            "$HOME"/rpmbuild/RPMS/*/kfaceauth-*.rpm \
            "$HOME"/rpmbuild/SRPMS/kfaceauth-*.src.rpm

      - name: Test install and uninstall lifecycle
        run: |
          rpm_path="$(find "$HOME/rpmbuild/RPMS" -type f -name 'kfaceauth-[0-9]*.rpm' -print -quit)"
          rpm -qp --requires "$rpm_path"
          if rpm -qlp "$rpm_path" | grep -Fq 'fake-provider'; then
            echo "Production RPM contains a fake provider" >&2
            exit 1
          fi
          dnf install -y "$rpm_path"
          rpm -V kfaceauth
          dnf remove -y kfaceauth
          packaging/fedora/rpm-smoke-test.sh "$rpm_path"

      - name: Collect RPM artifacts
        run: |
          packaging/fedora/collect-release-artifacts.sh \
            "$PWD/kfaceauth-5.0.0.tar.gz" \
            "$HOME/rpmbuild" \
            "$PWD/artifacts"

      - name: Upload RPM artifacts to Workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kfaceauth-fedora-44
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  release-upload:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: rpm
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    container: fedora:44
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install release upload dependencies
        run: dnf install -y gh rpm

      - name: Download verified workflow artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kfaceauth-fedora-44
          path: artifacts

      - name: Verify and attach the complete release artifact set
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v gh
          packaging/fedora/verify-release-artifacts.sh artifacts
          TAG_NAME="${{ github.event.release.tag_name }}"
          test -n "$TAG_NAME"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
